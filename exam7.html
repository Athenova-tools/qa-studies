<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ISTQB CTFL v4.0.1 Exam 7 - Comprehensive practice exam covering all syllabus chapters.">
  <title>Exam 7 &mdash; ISTQB CTFL v4.0.1 Exam Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#app" class="sr-only">Skip to main content</a>

  <header class="header" role="banner">
    <div class="header__inner">
      <a href="index.html" class="header__logo" aria-label="ISTQB CTFL Exam Simulator Home">
        <div class="header__logo-icon" aria-hidden="true">CT</div>
        <span class="header__logo-text">
          ISTQB CTFL
          <span class="header__logo-sub">Exam Simulator</span>
        </span>
      </a>
      <nav class="header__actions" aria-label="Main navigation">
        <a href="index.html" class="btn btn--ghost btn--sm">Home</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
      </nav>
    </div>
  </header>

  <div id="app" role="main">
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;padding:var(--space-xl);text-align:center;">
      <div>
        <div class="spinner" style="margin:0 auto var(--space-lg)"></div>
        <p style="color:var(--color-text-secondary);font-size:0.9375rem;">Loading exam&hellip;</p>
      </div>
    </div>
  </div>

  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <div class="footer__links">
        <a href="index.html">Home</a>
        <a href="exam1.html">Exam 1</a>
        <a href="exam2.html">Exam 2</a>
        <a href="exam3.html">Exam 3</a>
        <a href="exam4.html">Exam 4</a>
        <a href="exam5.html">Exam 5</a>
        <a href="exam6.html">Exam 6</a>
        <a href="exam7.html">Exam 7</a>
        <a href="exam8.html">Exam 8</a>
        <a href="exam9.html">Exam 9</a>
      </div>
      <p>&copy; 2026 ISTQB CTFL v4.0.1 Exam Simulator</p>
    </div>
  </footer>

  <script src="js/questions.js"></script>
  <script src="js/grading.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/slides.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      var stored = localStorage.getItem('istqb_ctfl_theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
      toggle.textContent = stored === 'dark' ? '\u2600' : '\u263E';
      toggle.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('istqb_ctfl_theme', next);
        toggle.textContent = next === 'dark' ? '\u2600' : '\u263E';
      });
    })();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof ExamEngine !== 'undefined' && ExamEngine.initExam) {
        ExamEngine.initExam(7);
      }
    });
  </script>
</body>
</html>
