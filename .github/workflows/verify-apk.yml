name: verify-apk

# Garante que o APK servido pela Pages é byte-idêntico ao asset da release.
# O workflow_run para "pages build and deployment" NÃO dispara (workflow
# automática), por isso o gatilho é o push (o deploy do Pages segue-se-lhe)
# e o disparo manual; os retries internos do script absorvem a janela do
# deploy (o site ainda a servir conteúdo velho).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: APK da release vs APK do site
        run: node js/verify_apk.js --ci
