name: verify-apk

# Garante que o APK servido pela Pages e o asset da release são byte-idênticos
# ao APK de referência versionado no commit. O push dispara antes do deploy;
# retries do script aguardam que release e Pages alcancem o artefacto esperado.
# workflow_run para a Pages automática não dispara; mantém-se também dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: APK da release vs APK do site
        run: node js/verify_apk.js --ci
