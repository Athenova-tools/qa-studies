<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ISTQB CTFL v4.0.1 Exam 8 - Certification Practice covering all six syllabus chapters with official weighting.">
  <title>Exam 8 &mdash; ISTQB CTFL v4.0.1 Exam Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#app" class="sr-only">Skip to main content</a>
  <header class="header" role="banner">
    <div class="header__inner">
      <a href="index.html" class="header__logo" aria-label="ISTQB CTFL Exam Simulator Home">
        <div class="header__logo-icon" aria-hidden="true">CT</div>
        <span class="header__logo-text">ISTQB CTFL<span class="header__logo-sub">Exam Simulator</span></span>
      </a>
      <nav class="header__actions" aria-label="Main navigation">
        <a href="index.html" class="btn btn--ghost btn--sm">Home</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
      </nav>
    </div>
  </header>
  <div id="app" role="main">
    <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;padding:var(--space-xl);text-align:center;">
      <div>
        <div class="spinner" style="margin:0 auto var(--space-lg)"></div>
        <p style="color:var(--color-text-secondary);font-size:0.9375rem;">Loading exam&hellip;</p>
      </div>
    </div>
  </div>
  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <p>&copy; 2026 ISTQB CTFL v4.0.1 Exam Simulator</p>
    </div>
  </footer>
  <script src="js/questions.js?v=2"></script>
  <script src="js/grading.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/slides.js"></script>
  <script>
            (function () {
      var toggle = document.getElementById('theme-toggle');
      /* Startup follows the system theme; the toggle carries the choice
         across pages for the current session only (sessionStorage ends
         with the session, so next launch is system again). */
      function systemDark() {
        try {
          return !!(window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) { return false; }
      }
      var initial = 'light';
      try {
        initial = sessionStorage.getItem('istqb_ctfl_theme') ||
          (systemDark() ? 'dark' : 'light');
      } catch (e) { initial = systemDark() ? 'dark' : 'light'; }
      document.documentElement.setAttribute('data-theme', initial);
      toggle.textContent = initial === 'dark' ? '\u2600' : '\u263E';
      toggle.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { sessionStorage.setItem('istqb_ctfl_theme', next); } catch (e) {}
        toggle.textContent = next === 'dark' ? '\u2600' : '\u263E';
      });
    })();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof ExamEngine !== 'undefined' && ExamEngine.initExam) {
        ExamEngine.initExam(8);
      }
    });
  </script>
</body>
</html>
